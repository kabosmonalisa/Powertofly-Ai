<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event hero — every event type — PowerToFly AI</title>
<!--
  EVENT HERO (option C) — ONE page for every event type with speakers. The dev bar switches
  EVENT TYPE (Chat & Learn · Meet with Companies · Summit) and SPEAKERS (the counts Rob gave
  for that type, plus None). Hero rule, same everywhere: first 4 speakers as cards on the photo,
  "+N more speakers" past 4, "Meet the speakers" below lists everyone.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ds/ptf.css">
<style>
/*
 * PAGE-SPECIFIC STYLES ONLY (tokens, never raw hex — see COMPONENT-INVENTORY
 * "Allowed page-specific CSS"). Everything visual not defined here comes from ptf.css.
 */

/* ── Fixed site header (alert + nav) — same wiring as events/hire/vjf/summit ── */
.site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
.site-header .nav { position: static; }

/* ── Event-detail hero — the reusable event-hero, shared verbatim with vjf/ + summit/. ── */
.ev-hero {
  position: relative; overflow: hidden;
  padding: var(--section-y) var(--gutter);
  background: radial-gradient(ellipse 1100px 720px at 50% -10%,
              rgba(79,232,169,0.22) 0%, rgba(213,255,102,0.12) 35%, var(--bg) 70%);
}
.ev-hero-inner {
  position: relative; z-index: 2; max-width: var(--container); margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1.1fr;
  gap: clamp(28px, 4vw, 56px); align-items: stretch;
}
.ev-hero-text { display: flex; flex-direction: column; align-items: flex-start; }
.ev-hero h1 { margin: 18px 0 0; max-width: 20ch; }
.ev-hero-sub { margin: 20px 0 0; font-size: 18px; line-height: 1.55; color: var(--ink-2); max-width: 52ch; }
.ev-hero .event-host { margin: 26px 0 0; }
/* Page-specific hero composition — OPTION C (agreed with Rob + Mara, Nov 2026):
   stock photo + darker overlay, host logo top-left, SPEAKER CARDS along the bottom.
   Small headshots on light cards, because real speaker photos are often low quality.
   Placement only, tokens only; no shared component is restyled.
     1-2 speakers  → wide cards (photo + name + role) in one row
     3             → three upright cards (round photo, name, role)
     4             → 2 x 2 compact cards
     5+            → the FIRST 4 in the speaker order + "+N more speakers" (links to #speakers)
   Who the first 4 are = the speaker order set in the CMS, so sponsors can be featured. */
/* The overlay is built from var(--bg) INSIDE .theme-dark (reads #0A0A0A), never a raw hex. */
.ev-hero-shade { position: absolute; inset: 0; z-index: 1; background:
  linear-gradient(to top,
    color-mix(in srgb, var(--bg) 82%, transparent) 12%,
    color-mix(in srgb, var(--bg) 30%, transparent) 62%,
    color-mix(in srgb, var(--bg) 40%, transparent) 100%); }
/* theme-dark recolors the label from the dark tokens; its own background is switched off so
   it doesn't paint a black box. The logo keeps --plate so a dark logo stays readable. */
.ev-hero-host { position: absolute; top: 20px; left: 20px; z-index: 2;
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
.ev-hero-host.theme-dark { background: none; }
.ev-hero-cap-org { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.ev-hero-cap-org.is-name { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
.ev-hero-speakers { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.ev-hero-more { font-size: 13px; font-weight: 600; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--ink) 55%, transparent); border: 1px solid rgba(255,255,255,.25); }
.ev-hero-more:hover { background: color-mix(in srgb, var(--ink) 75%, transparent); }
.ev-hero-more[hidden] { display: none; }
.ev-hero-cards { width: 100%; display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 8px; }
.ev-hero-cards.n1 { width: auto; max-width: 75%; align-self: flex-start; }
.ev-hero-card { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--r-lg);
  background: var(--surface); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.ev-hero-card img { width: 60px; height: 60px; border-radius: var(--r-md); object-fit: cover; object-position: center 25%; flex: none; background: var(--surface-2); }
.ev-hero-card-text { min-width: 0; }
.ev-hero-card-name { display: block; font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; color: var(--ink); line-height: 1.2; }
.ev-hero-card-role { display: block; font-size: 12.5px; color: var(--ink-3); line-height: 1.35; margin-top: 2px; }
.ev-hero-cards.n3 .ev-hero-card { flex-direction: column; text-align: center; gap: 8px; }
.ev-hero-cards.n3 .ev-hero-card img { width: 64px; height: 64px; border-radius: var(--r-pill); }
.ev-hero-cards.n4 .ev-hero-card { padding: 8px; gap: 10px; }
.ev-hero-cards.n4 .ev-hero-card img { width: 44px; height: 44px; }
.ev-hero-cards.n4 .ev-hero-card-name { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-hero-cards.n4 .ev-hero-card-role { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-hero-meta { display: grid; grid-template-columns: repeat(2, max-content); gap: 15px 40px; margin: 26px 0 0; }
.ev-fact { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); line-height: 1.4; }
.ev-fact svg { width: 18px; height: 18px; flex: none; fill: var(--ink-3); }
.ev-hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin: 32px 0 0; }
/* The hero image is a FIXED 4:3 slot at every width. It used to stretch to match the text
   column, so the crop changed with the headline length and partners could not be given one
   dimension. One ratio everywhere = one spec we can hand a client: 1600 x 1200. */
.ev-hero-media {
  position: relative; border-radius: var(--r-2xl); overflow: hidden;
  aspect-ratio: 4 / 3; align-self: center; background: var(--surface-2);
}
/* DIRECT child only — the slot now also holds the logo tile and the speaker avatar, and a
   blanket `.ev-hero-media img` rule stretched those to fill the frame too. */
.ev-hero-media > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* "About this session" — the per-event description, left-aligned readable column ── */
.cl-copy { max-width: var(--content-body); margin: 0 auto; }
.cl-copy .section-head { text-align: left; max-width: var(--content-narrow); margin: 0 0 20px; }
/* keep the DS 16px gap under the heading; only drop the centering + width cap so it left-aligns */
.cl-copy .section-head p { margin: 16px 0 0; max-width: none; }

/* "What you'll get out of this session" — the how-it-works timeline (portrait +
   check marks), same treatment as summit/. Portrait carries the generic mockup. */
.how-portrait-card { background-image: url('../photos/how_it_works.png'); background-position: center; }

/* "About PowerToFly" — same as summit/: left edge aligned with the other sections. */
.about-head { max-width: var(--content-body); margin: 0 auto; }
.about-head .section-head,
.about-head .about-stat-grid { max-width: var(--content-narrow); }

/* "Meet the speaker(s)" — page-specific speaker-bio layout (no DS component for this).
   Circular photo + name + role + bio, held to the readable column. Tokens only. */
.cl-speakers { max-width: var(--content-body); margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.cl-speaker { display: flex; gap: 24px; align-items: flex-start; max-width: var(--content-narrow); }
.cl-speaker-photo { width: 96px; height: 96px; border-radius: var(--r-pill); object-fit: cover; flex: none; background: var(--surface-2); }
.cl-speaker-name { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
.cl-speaker-role { font-size: 14px; color: var(--ink-3); margin: 3px 0 12px; }
.cl-speaker-bio { font-size: 15px; line-height: 1.6; color: var(--ink-2); margin: 0; }

/* "More Chat & Learns" — hold head + tiles to the shared content column. */
.ev-upnext { max-width: var(--content-body); margin: 0 auto; }
.ev-upnext .ev-list .ev-row:last-child { border-bottom: none; }

/* jump targets — offset for the fixed header */
#covers, #speakers, #more { scroll-margin-top: 140px; }

/* ── PROTOTYPE: hero event-state cues (upcoming / live / past) + dev switcher.
      Same wiring as summit/. Dot only appears in the live state. ── */
.eyebrow .dot.is-live { background: #E5372F; box-shadow: 0 0 0 3px rgba(229,55,47,0.16); animation: clLivePulse 1.6s ease-in-out infinite; }
.eyebrow.is-past { color: var(--ink-3); }
@keyframes clLivePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.8); } }
#devStates button { all: unset; cursor: pointer; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; padding: 8px 16px; border-radius: 9px; transition: background .12s ease, color .12s ease; }
#devStates button:hover { background: rgba(255,255,255,0.12); }
#devStates button.active { background: #fff; color: #0A0A0A; }
#devStates button.active:hover { background: #fff; }

/* ── Responsive ── */
@media (max-width: 820px) {
  .ev-hero-inner { grid-template-columns: 1fr; gap: 32px; }
  .ev-hero-media { order: -1; }   /* same 4:3 ratio on mobile — one crop everywhere */
  .ev-hero h1 { max-width: none; }
}
@media (max-width: 560px) {
  .ev-hero { padding: 40px 20px var(--section-y); }
  h1, h2, h3 { text-wrap: pretty; }
  .ev-hero h1 { font-size: clamp(30px, 8vw, 44px); }
  .ev-hero-sub { font-size: 16px; }
  .ev-hero-meta { grid-template-columns: 1fr; }
  /* option C on a phone: one column of slim cards (2 x 2 for four), names only */
  .ev-hero-cards, .ev-hero-cards.n3 { --cols: 1 !important; }
  .ev-hero-cards.n4 { --cols: 2 !important; }
  .ev-hero-cards.n1 { max-width: none; }
  .ev-hero-cards.n3 .ev-hero-card { flex-direction: row; text-align: left; }
  .ev-hero-card { padding: 7px; }
  .ev-hero-card img, .ev-hero-cards.n3 .ev-hero-card img { width: 40px; height: 40px; border-radius: var(--r-md); }
  .ev-hero-card-role { display: none; }
  .cl-speaker { gap: 16px; }
  .cl-speaker-photo { width: 72px; height: 72px; }
}
</style>
<style>
/* ── ONE PAGE, EVERY EVENT TYPE — the hero (option C) + "Meet the speakers" for
      Chat & Learn, Meet with Companies and Summit. The dev bar switches type + speaker count. ── */
.ev-hero-ctas[hidden], .hx-invite[hidden], .ev-hero-host[hidden], .ev-hero-speakers[hidden] { display: none; }
/* Meet with Companies keeps its invite card; here it sits under the hero text */
.hx-invite { margin-top: 28px; width: 100%; max-width: 500px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-xl); padding: 26px; box-shadow: 0 18px 44px rgba(10,10,10,0.06); }
.hx-invite-title { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
.hx-invite-body { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); margin: 10px 0 0; }
.hx-invite .auth-form { margin-top: 16px; }
.hx-logo-svg { width: 30px; height: 30px; display: block; }
.ev-hero-inner { align-items: start; }
#speakersEmpty { max-width: var(--content-narrow); font-size: 15px; color: var(--ink-3); margin: 0; }
/* dev bar — prototype only */
#devBar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 6px;
  background: #0A0A0A; padding: 10px 12px; border-radius: 16px; box-shadow: 0 12px 34px rgba(0,0,0,.34); font-family: 'Inter', sans-serif; max-width: calc(100vw - 24px); }
#devBar .row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
#devBar .lbl { color: #8a8a8a; font-size: 10px; font-weight: 700; letter-spacing: .12em; width: 84px; padding-left: 4px; }
#devBar .rule { color: #8a8a8a; font-size: 12px; padding: 0 4px 2px 92px; }
#devBar button { all: unset; cursor: pointer; color: #fff; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 9px; white-space: nowrap; }
#devBar button:hover { background: rgba(255,255,255,0.12); }
#devBar button.active { background: #fff; color: #0A0A0A; }
@media (max-width: 560px) { .ev-hero-cap-org.is-name { display: none !important; } #devBar .lbl { width: 100%; } #devBar .rule { padding-left: 4px; } #devBar button { padding: 6px 9px; font-size: 12px; } }
</style>
</head>
<body>
<div class="site-header" id="siteHeader">
  <div class="top-alert" id="topAlert">
    <span id="alertText"></span>
    <a id="alertCta" href="#hero">Register now →</a>
    <button class="top-alert-close" id="topAlertClose" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div data-ptf-nav data-active="events"></div>
</div>

<main>
<!-- HERO — option C, the same for every event type. Text left, 4:3 photo right (partner image 1600 x 1200),
     darker overlay, host logo top-left, speaker cards along the bottom: first 4 + "+N more speakers". -->
<section class="ev-hero" id="hero">
  <div class="ev-hero-inner">
    <div class="ev-hero-text">
      <div class="eyebrow" id="hxEyebrow"></div>
      <h1 class="display" id="hxTitle"></h1>
      <p class="ev-hero-sub" id="hxSub"></p>
      <div class="ev-hero-meta" id="hxFacts"></div>
      <div class="ev-hero-ctas" id="hxCtas">
        <a class="btn btn-primary" href="../event-common/index.html">Register now →</a>
        <a class="btn" id="hxCta2" href="#speakers"></a>
      </div>
      <!-- Meet with Companies only: the invite card (all its states live on meet-with-companies/) -->
      <aside class="hx-invite" id="hxInvite" hidden>
        <p class="hx-invite-title">Request your invite</p>
        <p class="hx-invite-body">This event is invite-only, but we'd love to consider you. Share your details and we'll follow up.</p>
        <form class="auth-form" onsubmit="return false">
          <div class="field"><label>Full name</label><input type="text" placeholder="Your name"></div>
          <div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div>
          <button class="btn-auth" type="submit">Request an invite →</button>
        </form>
      </aside>
    </div>

    <div class="ev-hero-media">
      <img id="hxImg" src="" alt="">
      <div class="ev-hero-shade theme-dark" aria-hidden="true"></div>
      <div class="ev-hero-host theme-dark" id="hxHost">
        <span class="ev-hero-cap-org">Hosted by</span>
        <div class="logo-cluster"><span class="logo-tile logo-tile--lg logo-tile--plate" id="hxLogo" style="display:inline-flex;align-items:center;justify-content:center"></span></div>
        <span class="ev-hero-cap-org is-name" id="hxHostName"></span>
      </div>
      <div class="ev-hero-speakers" id="hxSpeakers">
        <a class="ev-hero-more" id="heroMore" href="#speakers" hidden></a>
        <div class="ev-hero-cards" id="heroSpeakers"></div>
      </div>
    </div>
  </div>
</section>

<!-- MEET THE SPEAKERS — always lists everyone -->
<section class="section" id="speakers" style="background: var(--bg)">
  <div class="cl-copy">
    <div class="section-head" style="text-align:left; margin:0 0 36px"><h2 id="speakersHeading">Meet the speakers</h2></div>
  </div>
  <div class="cl-speakers" id="speakerBios"></div>
</section>
</main>
<div data-ptf-footer></div>

<!-- PROTOTYPE-ONLY dev bar — event type + speaker count. Delete before launch. -->
<div id="devBar">
  <div class="row"><span class="lbl">EVENT TYPE</span><span id="typeBtns"></span></div>
  <div class="row"><span class="lbl">SPEAKERS</span><span id="countBtns"></span></div>
  <div class="rule" id="ruleText"></div>
</div>

<script src="../ds/ptf.js"></script>

    var MAX_CARDS = 4;   /* hero shows the first 4 in the speaker order; the rest = "+N more" */
    var $ = function (id) { return document.getElementById(id); };
    var cur = { type: 'cl', n: DATA.cl.start };

    function fact(f) { return '<span class="ev-fact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + f[0] + '"/></svg>' + f[1] + '</span>'; }

    function render() {
      var d = DATA[cur.type], list = d.speakers.slice(0, cur.n);
      $('hxEyebrow').innerHTML = d.eyebrow; $('hxTitle').innerHTML = d.h1; $('hxSub').textContent = d.sub;
      $('hxFacts').innerHTML = d.facts.map(fact).join('');
      $('hxImg').src = d.img;
      $('alertText').innerHTML = d.label;
      $('hxCtas').hidden = d.invite; $('hxInvite').hidden = !d.invite;
      var c2 = $('hxCta2');
      if (d.cta2) { c2.textContent = d.cta2[0]; c2.href = d.cta2[1]; c2.hidden = false; }
      else { c2.textContent = list.length > 1 ? 'Meet the speakers' : 'Meet the speaker'; c2.href = '#speakers'; c2.hidden = !list.length; }
      $('hxHost').hidden = !d.host; $('hxLogo').innerHTML = d.host;
      $('hxHostName').textContent = d.hostName; $('hxHostName').hidden = !d.hostName;

      /* hero cards */
      var shown = list.slice(0, MAX_CARDS), extra = list.length - shown.length, k = shown.length;
      $('hxSpeakers').hidden = !k;
      var box = $('heroSpeakers');
      box.className = 'ev-hero-cards n' + k;
      box.style.setProperty('--cols', k === 4 ? 2 : k);
      box.innerHTML = shown.map(function (s) {
        return '<div class="ev-hero-card"><img src="https://i.pravatar.cc/160?img=' + s.face + '" alt="">' +
          '<span class="ev-hero-card-text"><span class="ev-hero-card-name">' + s.name + '</span>' +
          '<span class="ev-hero-card-role">' + s.role + '</span></span></div>';
      }).join('');
      $('heroMore').hidden = !extra;
      $('heroMore').textContent = extra ? '+' + extra + ' more speaker' + (extra > 1 ? 's' : '') : '';

      /* bios: everyone. No speakers → section hidden */
      $('speakers').hidden = !list.length;
      $('speakersHeading').textContent = list.length > 1 ? 'Meet the speakers' : 'Meet the speaker';
      $('speakerBios').innerHTML = list.map(function (s) {
        return '<div class="cl-speaker"><img class="cl-speaker-photo" src="https://i.pravatar.cc/200?img=' + s.face + '" alt="" loading="lazy">' +
          '<div class="cl-speaker-body"><h3 class="cl-speaker-name">' + s.name + '</h3><p class="cl-speaker-role">' + s.role + '</p>' +
          '<p class="cl-speaker-bio">' + s.bio + '</p></div></div>';
      }).join('');

      /* dev bar */
      $('typeBtns').innerHTML = Object.keys(DATA).map(function (t) {
        return '<button type="button" data-type="' + t + '" class="' + (t === cur.type ? 'active' : '') + '">' + DATA[t].label + '</button>';
      }).join('');
      $('countBtns').innerHTML = d.counts.map(function (n) {
        return '<button type="button" data-n="' + n + '" class="' + (n === cur.n ? 'active' : '') + '">' + (n ? n : 'None') + '</button>';
      }).join('');
      $('ruleText').textContent = d.rule;
      history.replaceState(null, '', '#' + cur.type + '/' + cur.n);
    }

    document.getElementById('devBar').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.type) { cur.type = b.dataset.type; cur.n = DATA[cur.type].start; }
      if (b.dataset.n) cur.n = +b.dataset.n;
      render();
    });
    function fromHash() {
      var h = (location.hash || '').slice(1).split('/');
      if (DATA[h[0]]) { cur.type = h[0]; cur.n = DATA[h[0]].counts.indexOf(+h[1]) >= 0 ? +h[1] : DATA[h[0]].start; }
    }
    fromHash(); render();
    window.addEventListener('hashchange', function () { fromHash(); render(); });
  })();
