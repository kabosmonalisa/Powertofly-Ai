<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top navigation — login experience — PowerToFly AI</title>
<meta property="og:title"       content="Top navigation — PowerToFly AI">
<meta property="og:description" content="The login experience: logged-out and logged-in top navigation, dropdowns live.">
<meta property="og:type"        content="website">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<!-- Design system -->
<link rel="stylesheet" href="../ds/ptf.css">
<style>
/* PREVIEW HARNESS ONLY. Three states stacked, each the real nav (ds/ptf.css + ptf.js) in an
   iframe rendered at the design-system width and scaled to fit — so no horizontal scroll. Each
   frame has fixed room for its dropdown, so hovering opens it in place with no growth / no jump. */
body { background: var(--bg-soft, #FAFAF6); }
.np-wrap { max-width: 1528px; margin: 0 auto; padding: 32px 32px 64px; }
.np-block { margin-bottom: 24px; }
.np-label { display: flex; align-items: center; gap: 8px; font-family: 'Inter Tight', sans-serif;
  font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--green, #1f9e6b); margin: 0 0 10px; }
.np-frame { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
.np-frame iframe { display: block; border: 0; transform-origin: top left; width: 1464px; }
</style>
</head>
<body>
<div class="np-wrap">
  <div class="np-block">
    <p class="np-label"><span class="dot"></span>Logged out</p>
    <div class="np-frame"><iframe data-h="536" src="state.html" title="Logged out"></iframe></div>
  </div>

  <div class="np-block">
    <p class="np-label"><span class="dot"></span>Logged in — Talent</p>
    <div class="np-frame"><iframe data-h="456" src="state.html#auth=in&mode=talent" title="Logged in — Talent"></iframe></div>
  </div>

  <div class="np-block">
    <p class="np-label"><span class="dot"></span>Logged in — Employer</p>
    <div class="np-frame"><iframe data-h="456" src="state.html#auth=in&mode=employer" title="Logged in — Employer"></iframe></div>
  </div>
</div>
<script>
  /* Render each nav at the design-system width, then scale it to fit its column (no horizontal
     scroll). Heights are fixed per state with room for the dropdown, so hovering opens it in
     place — no growth, no page jump. */
  var DESIGN_W = 1464;
  function layout() {
    [].forEach.call(document.querySelectorAll('.np-frame iframe'), function (ifr) {
      var frame = ifr.closest('.np-frame');
      var f = Math.min(1, frame.clientWidth / DESIGN_W);
      var h = parseInt(ifr.getAttribute('data-h'), 10) || 120;
      ifr.style.width = DESIGN_W + 'px';
      ifr.style.height = h + 'px';
      ifr.style.transform = 'scale(' + f + ')';
      frame.style.height = Math.round(h * f) + 'px';
    });
  }
  window.addEventListener('resize', layout);
  window.addEventListener('load', layout);
  layout();
</script>
</body>
</html>
