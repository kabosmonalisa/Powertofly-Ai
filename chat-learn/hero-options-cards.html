<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat &amp; Learn hero — speaker cards</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ds/ptf.css">
<style>
/*
 * PAGE-SPECIFIC STYLES ONLY (tokens, never raw hex — see COMPONENT-INVENTORY
 * "Allowed page-specific CSS"). Everything visual not defined here comes from ptf.css.
 */

/* ── Fixed site header (alert + nav) — same wiring as events/hire/vjf/summit ── */
.site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
.site-header .nav { position: static; }

/* ── Event-detail hero — the reusable event-hero, shared verbatim with vjf/ + summit/. ── */
.ev-hero {
  position: relative; overflow: hidden;
  padding: var(--section-y) var(--gutter);
  background: radial-gradient(ellipse 1100px 720px at 50% -10%,
              rgba(79,232,169,0.22) 0%, rgba(213,255,102,0.12) 35%, var(--bg) 70%);
}
.ev-hero-inner {
  position: relative; z-index: 2; max-width: var(--container); margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1.1fr;
  gap: clamp(28px, 4vw, 56px); align-items: stretch;
}
.ev-hero-text { display: flex; flex-direction: column; align-items: flex-start; }
.ev-hero h1 { margin: 18px 0 0; max-width: 20ch; }
.ev-hero-sub { margin: 20px 0 0; font-size: 18px; line-height: 1.55; color: var(--ink-2); max-width: 52ch; }
.ev-hero .event-host { margin: 26px 0 0; }
/* Page-specific hero composition: the host logo + speaker sit ON the image over a scrim,
   the same object the Resources hero makes of its featured story. Placement only — the scrim
   is built from var(--bg) inside .theme-dark (never a raw hex) and no shared component is
   restyled. The stock photo carries the session's identity instead of baked-in artwork. */
/* theme-dark sits on THIS element, not a child: var(--bg) resolves where the class is, so the
   scrim reads #0A0A0A instead of the light theme's near-white. */
.ev-hero-cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 120px 26px 26px; border-radius: 0 0 var(--r-2xl) var(--r-2xl);
  background: linear-gradient(to top,
    color-mix(in srgb, var(--bg) 94%, transparent) 0%,
    color-mix(in srgb, var(--bg) 86%, transparent) 34%,
    color-mix(in srgb, var(--bg) 55%, transparent) 62%,
    transparent 100%); }
/* The caption is two rows on one left edge: who is hosting, then who is speaking. Both rows
   lead with a small muted label-or-face and settle on the same baseline rhythm. */
.ev-hero-cap-text { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; min-width: 0; }
/* The host STACKS: label over mark, so the plate keeps a clean left edge with the speaker
   face below it instead of having text hanging off its side at a different height.
   The label is a plain muted uppercase, deliberately NOT .eyebrow — the hero already has one
   green eyebrow ("Chat & Learn") and a second would compete with it. */
.ev-hero-host { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
.ev-hero-cap-org { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.ev-hero-cap-org.is-name { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
/* two or more speakers: the stack keeps the names on one line, so they get no role line */
.ev-hero-cap .event-host-name { font-size: 19px; }
.ev-hero-cap .event-host-role { font-size: 15px; }
.ev-hero-cap .event-host { margin-bottom: 0; gap: 16px; }
/* Bigger faces in the hero ONLY: the shared .ev-faces disc is 32px, sized for listing rows.
   On the photo the speakers are the draw, so they get 80px here; the overlap and +N disc
   scale with them. Size only, scoped to this caption, so listing rows elsewhere keep 32px. */
.ev-hero-cap .ev-faces img,
.ev-hero-cap .ev-faces-count { width: 80px; height: 80px; margin-left: -20px; border-width: 3px; }
.ev-hero-cap .ev-faces img:first-child { margin-left: 0; }
.ev-hero-cap .ev-faces-count { font-size: 17px; }
.ev-hero-cap .ev-faces { flex: none; }
/* At 80px a stack of 3 faces + "+N" leaves no room beside it, so with two or more speakers
   the names drop UNDER the faces; a single speaker keeps face-left, name-right. */
.ev-hero-cap .event-host:has(.ev-faces img + img) { flex-direction: column; align-items: flex-start; gap: 12px; }
.ev-hero-meta { display: grid; grid-template-columns: repeat(2, max-content); gap: 15px 40px; margin: 26px 0 0; }
.ev-fact { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); line-height: 1.4; }
.ev-fact svg { width: 18px; height: 18px; flex: none; fill: var(--ink-3); }
.ev-hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin: 32px 0 0; }
/* The hero image is a FIXED 4:3 slot at every width. It used to stretch to match the text
   column, so the crop changed with the headline length and partners could not be given one
   dimension. One ratio everywhere = one spec we can hand a client: 1600 x 1200. */
.ev-hero-media {
  position: relative; border-radius: var(--r-2xl); overflow: hidden;
  aspect-ratio: 4 / 3; align-self: center; background: var(--surface-2);
}
/* DIRECT child only — the slot now also holds the logo tile and the speaker avatar, and a
   blanket `.ev-hero-media img` rule stretched those to fill the frame too. */
.ev-hero-media > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* "About this session" — the per-event description, left-aligned readable column ── */
.cl-copy { max-width: var(--content-body); margin: 0 auto; }
.cl-copy .section-head { text-align: left; max-width: var(--content-narrow); margin: 0 0 20px; }
/* keep the DS 16px gap under the heading; only drop the centering + width cap so it left-aligns */
.cl-copy .section-head p { margin: 16px 0 0; max-width: none; }

/* "What you'll get out of this session" — the how-it-works timeline (portrait +
   check marks), same treatment as summit/. Portrait carries the generic mockup. */
.how-portrait-card { background-image: url('../photos/how_it_works.png'); background-position: center; }

/* "About PowerToFly" — same as summit/: left edge aligned with the other sections. */
.about-head { max-width: var(--content-body); margin: 0 auto; }
.about-head .section-head,
.about-head .about-stat-grid { max-width: var(--content-narrow); }

/* "Meet the speaker(s)" — page-specific speaker-bio layout (no DS component for this).
   Circular photo + name + role + bio, held to the readable column. Tokens only. */
.cl-speakers { max-width: var(--content-body); margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.cl-speaker { display: flex; gap: 24px; align-items: flex-start; max-width: var(--content-narrow); }
.cl-speaker-photo { width: 96px; height: 96px; border-radius: var(--r-pill); object-fit: cover; flex: none; background: var(--surface-2); }
.cl-speaker-name { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
.cl-speaker-role { font-size: 14px; color: var(--ink-3); margin: 3px 0 12px; }
.cl-speaker-bio { font-size: 15px; line-height: 1.6; color: var(--ink-2); margin: 0; }

/* "More Chat & Learns" — hold head + tiles to the shared content column. */
.ev-upnext { max-width: var(--content-body); margin: 0 auto; }
.ev-upnext .ev-list .ev-row:last-child { border-bottom: none; }

/* jump targets — offset for the fixed header */
#covers, #speakers, #more { scroll-margin-top: 140px; }

/* ── PROTOTYPE: hero event-state cues (upcoming / live / past) + dev switcher.
      Same wiring as summit/. Dot only appears in the live state. ── */
.eyebrow .dot.is-live { background: #E5372F; box-shadow: 0 0 0 3px rgba(229,55,47,0.16); animation: clLivePulse 1.6s ease-in-out infinite; }
.eyebrow.is-past { color: var(--ink-3); }
@keyframes clLivePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.8); } }
#devStates button { all: unset; cursor: pointer; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; padding: 8px 16px; border-radius: 9px; transition: background .12s ease, color .12s ease; }
#devStates button:hover { background: rgba(255,255,255,0.12); }
#devStates button.active { background: #fff; color: #0A0A0A; }
#devStates button.active:hover { background: #fff; }

/* ── Responsive ── */
@media (max-width: 820px) {
  .ev-hero-inner { grid-template-columns: 1fr; gap: 32px; }
  .ev-hero-media { order: -1; }   /* same 4:3 ratio on mobile — one crop everywhere */
  .ev-hero h1 { max-width: none; }
}
@media (max-width: 560px) {
  .ev-hero { padding: 40px 20px var(--section-y); }
  h1, h2, h3 { text-wrap: pretty; }
  .ev-hero h1 { font-size: clamp(30px, 8vw, 44px); }
  .ev-hero-sub { font-size: 16px; }
  .ev-hero-meta { grid-template-columns: 1fr; }
  .cl-speaker { gap: 16px; }
  .cl-speaker-photo { width: 72px; height: 72px; }
}


/* ── EXPLORATION ONLY: speaker cards replace the stock image. Not a production page. ──
   Card language borrowed from the playbook's .tal-card (bg card, --line border, --r-xl,
   photo at center 22%), laid out to fill the fixed 4:3 hero slot. */
.ev-hero { padding-bottom: 120px; }
.vF { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-2xl); }
.vF-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 4px 0; }
.vF-host { display: flex; align-items: center; gap: 12px; }
.vF-host .ev-hero-cap-org { color: var(--ink-3); }
.vF-host .logo-tile--lg { height: 40px; min-width: 40px; padding: 7px 12px; }
.vF-more { font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: none; padding: 7px 12px; border-radius: var(--r-pill); background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.vF-more:empty { display: none; }
.vF-grid { flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); }
.vF-grid.n4 { grid-template-columns: 1fr 1fr; }
.vF-card { display: flex; min-height: 0; min-width: 0; overflow: hidden; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-xl); }
.vF-ph { flex: none; height: 100%; aspect-ratio: 1; background-size: cover; background-position: center 22%; background-color: var(--surface-2); }
.vF-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 12px 18px; }
.vF-name { font-family: 'Inter Tight', sans-serif; font-weight: 700; letter-spacing: -0.02em; font-size: 18px; line-height: 1.2; }
.vF-role { color: var(--ink-3); font-size: 13.5px; line-height: 1.4; margin-top: 3px; }
/* 1 — one card takes the whole slot: half photo, half name */
.vF-grid.n1 .vF-ph { aspect-ratio: auto; width: 50%; }
.vF-grid.n1 .vF-body { padding: 24px; }
.vF-grid.n1 .vF-name { font-size: clamp(22px, 2.4vw, 30px); }
.vF-grid.n1 .vF-role { font-size: 15px; margin-top: 6px; }
/* 2 — two stacked rows */
.vF-grid.n2 .vF-name { font-size: 21px; }
/* 3 — three stacked rows */
.vF-grid.n3 .vF-name { font-size: 17px; }
.vF-grid.n3 .vF-role { font-size: 13px; }
/* 4 — 2 x 2, same row card as 2/3 (square photo left): a wide strip of photo cut the heads off */
.vF-grid.n4 .vF-ph { aspect-ratio: auto; width: 44%; }
.vF-grid.n4 .vF-body { padding: 10px 12px; }
.vF-grid.n4 .vF-name { font-size: 15px; }
.vF-grid.n4 .vF-role { font-size: 12px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#devBar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; gap: 6px;
  background: #0A0A0A; padding: 8px 10px; border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.34); font-family: 'Inter', sans-serif; max-width: calc(100vw - 24px); overflow-x: auto; }
#devBar .dv-l { color: #8a8a8a; font-size: 10px; font-weight: 700; letter-spacing: .12em; padding: 0 8px 0 4px; white-space: nowrap; }
#devBar button { all: unset; cursor: pointer; color: #fff; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 9px; }
#devBar button:hover { background: rgba(255,255,255,0.12); }
#devBar button.active, #devBar button.active:hover { background: #fff; color: #0A0A0A; }
@media (max-width: 560px) {
  .vF { padding: 10px; gap: 8px; } .vF-grid { gap: 7px; }
  .vF-host .ev-hero-cap-org { display: none; }
  .vF-body { padding: 8px 12px; } .vF-name { font-size: 15px !important; } .vF-role { font-size: 12px !important; }
  .vF-grid.n1 .vF-body { padding: 14px; } .vF-grid.n1 .vF-name { font-size: 20px !important; }
  .vF-grid.n4 .vF-role { display: none; } .vF-grid.n4 .vF-ph { width: 40%; } .vF-grid.n4 .vF-body { padding: 8px; } .vF-grid.n4 .vF-name { font-size: 13px !important; }
}
</style>
</head>
<body>
<!-- EXPLORATION — speaker cards fill the hero slot instead of a stock photo.
     1 = one card fills it · 2 / 3 = stacked rows · 4 = 2x2 · 5+ = first 4 + "+N more". -->
<section class="ev-hero"><div class="ev-hero-inner"><div class="ev-hero-text">
      <div class="eyebrow">Chat &amp; Learn</div>
      <h1 class="display">Beyond the résumé: building human-first AI for <em class="italic-plain">fairer access to opportunity</em></h1>
      <p class="ev-hero-sub">Ever feel like your résumé barely scratches the surface of what you can actually do?</p>

      <div class="ev-hero-meta">
        
        <span class="ev-fact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>August 6, 2026</span>
        <span class="ev-fact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>1:00 – 2:00 PM ET</span>
        <span class="ev-fact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>Virtual</span>
        <span class="ev-fact"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Free to attend</span>
      </div>

      <div class="ev-hero-ctas">
        <a class="btn btn-primary" href="#" rel="noopener">Register now →</a>
        <a class="btn" href="#">Meet the speaker</a>
      </div>
    </div>

    
  <div class="ev-hero-media"><div class="vF">
    <div class="vF-head"><div class="vF-host"><span class="ev-hero-cap-org">Hosted by</span><div class="logo-cluster"><span class="logo-tile logo-tile--lg logo-tile--plate"><img src="../logos/zapier.png" alt="Zapier"></span></div></div><a class="vF-more" href="#" data-more></a></div>
    <div class="vF-grid" data-v="F"></div>
  </div></div>
</div></section>
<div id="devBar"><span class="dv-l">SPEAKERS</span><button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button><button type="button" data-n="4">4</button><button type="button" data-n="6">6</button><button type="button" data-n="10">10</button></div>
<script>
(function () {
  var P = 'hero-options/';
  var S = [
    ['Colette Hart','Co-founder &amp; CEO, Idonea','colette'], ['Dana Ruiz','Head of Talent, Zapier','dana'],
    ['Sam Okonjo','Staff Engineer, Zapier','sam'], ['Jordan Ellis','VP People, Zapier','s4'],
    ['Lena Fischer','Product Director, Idonea','s5'], ['Rafael Ortiz','CTO, Lattice','s6'],
    ['Amara Diallo','Talent Partner, Visa','s7'], ['Tom Becker','Engineering Manager, Plaid','s8'],
    ['Grace Owusu','Recruiting Lead, Expedia','s9'], ['Diego Navarro','Data Scientist, Zillow','s10']
  ].map(function (a) { return { name: a[0], role: a[1], img: P + a[2] + '.jpg' }; });
  var MAX = 4, grid = document.querySelector('[data-v="F"]'), more = document.querySelector('[data-more]');
  function render(n) {
    var shown = S.slice(0, Math.min(n, MAX)), extra = n - shown.length;
    grid.className = 'vF-grid n' + shown.length;
    grid.innerHTML = shown.map(function (s) {
      return '<div class="vF-card"><div class="vF-ph" style="background-image:url(\'' + s.img + '\')"></div>' +
        '<div class="vF-body"><div class="vF-name">' + s.name + '</div><div class="vF-role">' + s.role + '</div></div></div>';
    }).join('');
    more.textContent = extra ? '+' + extra + ' more speakers' : '';
    document.querySelectorAll('#devBar [data-n]').forEach(function (b) { b.classList.toggle('active', +b.dataset.n === n); });
  }
  document.querySelectorAll('#devBar [data-n]').forEach(function (b) { b.addEventListener('click', function () { render(+b.dataset.n); }); });
  render(4);
})();
</script>
</body>
</html>
